<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Assistant</title>
    <script src="/static/js/game-tracker.js"></script>
    <script src="/static/js/pepper-voice.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
        }
        h1 { text-align: center; color: #333; }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            background: #fafafa;
        }
        .message {
            margin: 15px 0;
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        .user { background: #667eea; color: white; margin-left: auto; }
        .ai { background: #f0f0f0; color: #333; margin-right: auto; }
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 15px; border: 2px solid #e0e0e0; border-radius: 30px; }
        button { padding: 15px 30px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 30px; cursor: pointer; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Chat Assistant</h1>
        <div class="chat-box" id="chatBox">
            <div class="message ai">👋 Hi! I'm your friendly AI assistant. How are you today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
        <a href="/" class="back-btn">← Back to Games</a>
    </div>
    <script>
        const stats = new GameStats('ai_chat');
        
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            setTimeout(() => {
                const response = "That's interesting! Tell me more. I love talking with you! 💕";
                addMessage(response, 'ai');
                stats.addCorrect();
                PepperVoice.speak(response);
            }, 500);
            input.value = '';
        }
        
        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + sender;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        PepperVoice.speak("Hello! I'm your AI friend. Ask me anything!");
    </script>
</body>
</html>
