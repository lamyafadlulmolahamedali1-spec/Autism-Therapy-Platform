<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pepper - Emotion Detection</title>
    <script src="/static/js/pepper-voice.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .emotion-box {
            font-size: 100px;
            margin: 20px;
            padding: 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
        }
        .emotion-text {
            font-size: 24px;
            margin-top: 20px;
        }
        button {
            background: #e94560;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        .game-btn {
            background: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Pepper - Emotion Detection</h1>
        <div class="emotion-box" id="emotionBox">😐</div>
        <div class="emotion-text" id="emotionText">Neutral</div>
        <button onclick="window.location.href='/games'">🎮 Play Games (localhost:5009)</button>
        <button class="game-btn" onclick="window.location.href='http://localhost:5009'">🎮 Open Games Dashboard</button>
        <button onclick="window.location.href='/'">🎮 All Games</button>
    </div>
    <script>
        PepperVoice.welcome("Child");
        
        function updateEmotion() {
            fetch('/emotion')
                .then(res => res.json())
                .then(data => {
                    const emojis = {
                        'happy': '😊', 'sad': '😢', 'angry': '😠',
                        'surprise': '😲', 'fear': '😨', 'disgust': '🤢', 'neutral': '😐'
                    };
                    const emoji = emojis[data.emotion] || '😐';
                    document.getElementById('emotionBox').innerHTML = emoji;
                    document.getElementById('emotionText').innerHTML = data.emotion.toUpperCase();
                });
        }
        
        updateEmotion();
        setInterval(updateEmotion, 2000);
        PepperVoice.speak("I can see your emotions! Smile for me!");
    </script>
</body>
</html>
